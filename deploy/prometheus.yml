global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway-1:8080", "gateway-2:8080"]

  # vLLM exports vllm:* metrics natively; the simulated workers mimic them.
  - job_name: workers
    static_configs:
      - targets: ["vllm-1:8000", "vllm-2:8000", "vllm-3:8000", "ollama-1:11434"]
