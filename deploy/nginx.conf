# L7 load balancer in front of the stateless gateway replicas. Any replica can
# serve any request: affinity state lives in the KV caches of the workers and
# every replica computes the same rendezvous hash, so they agree on placement.
worker_processes auto;
events { worker_connections 4096; }

http {
  upstream gateways {
    least_conn;
    server gateway-1:8080 max_fails=3 fail_timeout=10s;
    server gateway-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 128;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;

      # Server-sent events: never buffer, never time out a healthy stream early.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      chunked_transfer_encoding on;
    }
  }
}
