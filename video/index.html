<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Inference Gateway Walkthrough</title>
<style>
  @font-face { font-family: Virgil; src: url(assets/Virgil.woff2) format('woff2'); }
  @font-face { font-family: Cascadia; src: url(assets/Cascadia.woff2) format('woff2'); }
  html, body { margin: 0; background: #fffdf8; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
  init(document.getElementById('c'));
  window.DURATION = DURATION;
  window.renderFrame = renderFrame;
  window.ready = Promise.all([
    document.fonts.load('40px Virgil'),
    document.fonts.load('40px Cascadia'),
  ]).then(() => document.fonts.ready).then(() => true);
  // Interactive preview: open index.html?play in a browser.
  if (location.search.includes('play')) {
    window.ready.then(() => {
      const t0 = performance.now();
      const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
      loop();
    });
  }
</script>
</body>
</html>
